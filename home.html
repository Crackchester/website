<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hackchester - Cyber Security Society</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-left">
      <img src="assets/img/logo.png" alt="Hackchester Logo" class="nav-logo">
      <span class="nav-company-name">Hackchester</span>
    </div>
    <div class="navbar-right">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Events</a>
      <a href="#">Contact</a>
    </div>
  </nav>

  <!-- Home -->
  <div class="main-content">
    <div class="logo-container">
      <img src="assets/img/logo.png" alt="Hackchester Logo" class="logo">
      <h1 class="company-name">Hackchester</h1>
    </div>
    <span class="company-tagline">Cyber Security Society at the University of Manchester</span>
  </div>

  <!-- Particles.js Background -->
  <div id="particles-js"></div>

  <!-- Scripts -->
  <script>
    particlesJS('particles-js', {
      particles: {
        number: {
          value: 100,
          density: { enable: true, value_area: 800 }
        },
        shape: {
          type: 'circle',
          stroke: { width: 0, color: '#000000' }
        },
        opacity: {
          value: 0.5,
          random: true,
          anim: { enable: true, speed: 1, opacity_min: 0.1 }
        },
        size: {
          value: 3,
          random: true,
          anim: { enable: false }
        },
        move: {
          enable: true,
          speed: 1,
          direction: 'none',
          random: false,
          straight: false,
          out_mode: 'out',
          bounce: false,
          attract: { enable: false }
        }
      },
      interactivity: {
        detect_on: 'canvas',
        events: {
          onhover: { enable: false, mode: 'repulse' }, // Disable hover interaction
          onclick: { enable: false, mode: 'push' } // Disable click interaction
        }
      },
      retina_detect: true
    });
  </script>

</body>
</html>
